include standalone/asm/**/*.asm
include standalone/cj/**/*.cj

exclude standalone/**/*.aot.cj

############################################################################################

# Please uncomment left testcases in foreign-pbv test after Float16 is supported.

# ThrowException fail, abort.
# Two pending exceptions are thrown when a C function calls Cangjie function. Program will abort.
exclude standalone/cj/throwOOM/throw.cj O2

# ignore the tests to avoid inline and cjc compilation error
exclude standalone/cj/throwDiv/throwDiv.cj O2
exclude standalone/cj/throwMod/throwMod.cj O2
# COMP traverse extensions during invoke resolve
exclude standalone/cj/lambda-method-ref-extend/main.cj
exclude standalone/cj/lambda-method-ref-static-extend/main.cj
