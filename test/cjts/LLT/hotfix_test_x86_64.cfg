[root]
  path = ../../
[suffix]
  cj = //
  info = //
[inherit]
inherit=./cjnative_test.cfg
[condition]
condition =
  CJNATIVE
  x86
  Linux
  Unix
[internal-var]
  compiler = cjc-wrapper -j4
  cjc = cjc-wrapper
  frontendCompiler = cjc-frontend -j1
  run_opt = 
  run = launcher-wrapper

  cmp_opt = --error-count-limit=10000 --diagnostic-format=noColor --emit-chir --continue
[description]
  title = cangjie_cjnative_test_hotfix
[env]
  LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
